{% extends 'layout.html' %}

{% block title %}
trekker Login - trailbliss
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            🥾
        </div>

        <h1>Trekker Login</h1>

        <p class="subtitle">
            Sign in for Booking Treks
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="username">Email</label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    name="passhash"
                    id="passhash"
                    class="form-control"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>
            <p>Not Registered yet? <a href="{{url_for('main.trekker_register')}}">Register here</a></p>

        </form>

    </div>

</div>

{% endblock %}

{% block style %}

<style>

body{
    background:linear-gradient(135deg,#F5F9FF,#FFF8F2);
    min-height:100vh;
}


.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:80px 20px;
}

.login-card{
    width:420px;
    background:#fff;
    padding:40px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.10);
    transition:.3s;
}

.login-card:hover{
    transform:translateY(-4px);
}

.login-icon{
    width:85px;
    height:85px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#FFF3E8;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;
}


.login-card h1{
    text-align:center;
    color:#234E70;
    margin-bottom:8px;
    font-size:36px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#444;
}

.form-control{
    width:100%;
    padding:13px 15px;
    border:1px solid #D9E2EC;
    border-radius:10px;
    font-size:16px;
    transition:.3s;
    box-sizing:border-box;
}

.form-control:focus{
    outline:none;
    border-color:#4F8EF7;
    box-shadow:0 0 0 3px rgba(79,142,247,.15);
}


.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#4F8EF7;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#356AC3;
    transform:translateY(-2px);
}





</style>

{% endblock %}
